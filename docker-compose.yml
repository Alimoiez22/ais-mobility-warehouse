# Database service for the AIS Mobility Data Warehouse.
# Start it with `make up` (or `docker compose up -d --wait`).
services:
  db:
    # Pinned by digest, not by tag: a tag like `latest` can point to a different
    # image tomorrow; a digest always means these exact bytes.
    # Contents verified 28 Oct 2026: PostgreSQL 18, PostGIS 3.6.4, MobilityDB 1.3.0.
    image: mobilitydb/mobilitydb@sha256:8409e3897e2b88561bef4374110c3da5f7ff56838a7745315f1c2f111305dd24
    container_name: ais-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Host port 5433 (not 5432) so it cannot clash with another PostgreSQL on this PC.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      # Named volume: the database survives `docker compose down`.
      - pgdata:/var/lib/postgresql
      # SQL files and downloaded data are visible inside the container, read-only.
      - ./sql:/sql:ro
      - ./data:/data:ro
    # Larger shared memory so PostgreSQL can run parallel queries on big tables.
    shm_size: 1gb
    healthcheck:
      # The server needs a few seconds after start; this tells Docker when it is ready.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  pgdata:
    name: ais_pgdata
